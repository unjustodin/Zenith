[mod-setting-name]
f3d-surface=Surface to stream
f3d-chunks-per-tick=Chunk snapshots per tick
f3d-bytes-per-tick=Bytes sent per tick
f3d-max-focus-radius=Max live-update radius (tiles)
f3d-mover-interval=Moving entity update interval (ticks)
f3d-detail-radius=Belt item, ground item and inserter radius (tiles)
f3d-detail-interval=Belt item and inserter update interval (ticks)
f3d-starter-kit=Give the puppet character a starter kit
f3d-player=Player to play as

[mod-setting-description]
f3d-surface=Surface the puppet character is created on and the 3D client sees. Ignored in single-player, where the player's own surface is used.
f3d-chunks-per-tick=How many 32x32 chunks are read and sent per tick while the client loads the world. Raise it for faster loading, lower it if the game stutters.
f3d-bytes-per-tick=Upper bound on queued world data sent to the client each tick. Keeps the client's UDP receive buffer from overflowing.
f3d-max-focus-radius=Moving things (biters, trains, robots) and machine states are only streamed within this distance of the client's camera.
f3d-mover-interval=Lower is smoother but costs more script time.
f3d-detail-radius=Items on belts, items on the ground and inserter hands are streamed within this distance of the client's camera (and never beyond the live-update radius). 0 turns them off. Lower it if a dense base slows the game down.
f3d-detail-interval=Ticks between belt item and inserter updates. The client glides items and arms in between, so lower is only slightly smoother but costs more script time.
f3d-starter-kit=When the bridge creates its own character on a server, give it the same items a new freeplay player gets.
f3d-player=Name of the player whose character the 3D client plays on a server. While they're not connected, the bridge's character stands in where theirs was and carries their inventory, armour, guns, logistic requests and crafting queue; they get it all back when they join. Empty: the player who was online last (the owner of a save played alone). /f3d-player changes it while the game runs.

[command-help]
f3d-status=Show the Zenith bridge status: the clients, the character, the bridge's cost.
f3d-selftest=Check the Zenith bridge's character API in this game (single-player or server).
f3d-platform=Space platforms for the Zenith bridge's character: list | new [planet] | board <platform> | leave [planet].
f3d-player=Whose character the Zenith client plays: /f3d-player lists the players; /f3d-player <name> | none picks.
f3d-profile=Time the Zenith bridge's modules (on/off); /f3d-status shows it. /f3d-profile trace also logs every tick's times.
f3d-rate=Slow the Zenith bridge's costliest updates down: 0 (normal) to 3.

[controls]
f3d-show-3d=Show in Zenith (3D)

[controls-description]
f3d-show-3d=Brings the Zenith 3D client's window to the front, on the same game. Ctrl+F9 in the client comes back here.
